[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pawwatch"
version = "0.3.0"
description = "Animal vital-range data model for the PawWatch abnormal-activity tracker."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "PawWatch hackathon team" }]
license = { text = "MIT" }
dependencies = []   # core model is dependency-free

[project.optional-dependencies]
charts = ["pandas>=1.5", "matplotlib>=3.6"]   # only needed for summarize.py

[tool.setuptools]
packages = ["pawwatch"]

[tool.setuptools.package-data]
pawwatch = ["animal_vitals.csv"]   # ship the dataset inside the install
